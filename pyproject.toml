[project]
name = "market-radar"
version = "0.1.0"
description = "Global Financial News & Multi-Market Data Radar (TW/US/HK/JP/Macro)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".claude/skills/commit-workflow/scripts"]
testpaths = [".claude/skills/commit-workflow/scripts/tests", "tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
